name: Lint

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate terraform configuration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform validate
        uses: dflook/terraform-validate@v2

  fmt-check:
    runs-on: ubuntu-latest
    name: Check formatting of terraform files
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform fmt check
        uses: dflook/terraform-fmt-check@v2

  terraform-test:
    runs-on: ubuntu-latest
    name: Terraform test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Run terraform test in each module
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for testdir in modules/*/tests; do
            module="$(dirname "$testdir")"
            tests=("$testdir"/*.tftest.hcl)
            if [ ${#tests[@]} -eq 0 ]; then
              continue
            fi
            found=1
            echo "Testing ${module}"
            (cd "$module" && terraform init -backend=false && terraform test)
          done
          if [ "$found" -eq 0 ]; then
            echo "No module tests found"
            exit 1
          fi

